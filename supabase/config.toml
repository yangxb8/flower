# Website Keyword Monitor — Supabase project config
# See: https://supabase.com/docs/guides/cli/config

project_id = "flower-keyword-monitor"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.monitor-check]
verify_jwt = false
