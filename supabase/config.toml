# Website Keyword Monitor — Supabase project config
# See: https://supabase.com/docs/guides/cli/config

project_id = "flower-keyword-monitor"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# Email testing server (CLI 3 renamed [inbucket] to [local_smtp]).
[local_smtp]
enabled = true
port = 54324

# Native local stack (no Docker) for Cloud Agents; Docker is used when the daemon is reachable.
[experimental]
stack = true

[storage]
enabled = false

[auth]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

# Loaded from supabase/.env (gitignored). Injected into the local edge runtime.
[edge_runtime.secrets]
ALERT_EMAIL = "env(ALERT_EMAIL)"
RESEND_API_KEY = "env(RESEND_API_KEY)"
MONITOR_CRON_SECRET = "env(MONITOR_CRON_SECRET)"

[functions.monitor-check]
verify_jwt = false
